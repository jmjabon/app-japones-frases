<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nihongo Flow</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" type="image/png" href="./media/iconFrases.jpg">
    <link rel="apple-touch-icon" href="./media/iconFrases.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden selection:bg-indigo-100">
    <!-- Navbar global -->
    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md border-b border-slate-200 z-50 env-safe-top">
        <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
            <h1 class="font-bold text-lg text-indigo-900 flex items-center gap-2">
                <i data-lucide="tent-tree"></i> Nihongo Flow
            </h1>
            <div class="flex gap-3">
                <button id="toggle-furigana" class="text-xs font-semibold px-2 py-1 rounded bg-slate-100 text-slate-600 border border-slate-200 shadow-sm active:scale-95 transition-transform">Furigana: ON</button>
                <button id="toggle-romaji" class="text-xs font-semibold px-2 py-1 rounded bg-slate-100 text-slate-600 border border-slate-200 shadow-sm active:scale-95 transition-transform">Romaji: ON</button>
            </div>
        </div>
    </nav>

    <main id="app-container" class="pt-20 pb-safe-bottom max-w-3xl mx-auto px-4 min-h-screen">
        <!-- Las vistas se inyectarán aquí mediante JS -->
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
